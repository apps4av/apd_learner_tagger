name: Tag airport diagrams

on:
  schedule:
    - cron: "0 9 * * 0"   # 05:00 America/New_York during EDT
    - cron: "0 10 * * 0"  # 05:00 America/New_York during EST
  workflow_dispatch:
    inputs:
      force:
        description: "Build now, bypassing the Sunday release-week gate"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - uses: actions/checkout@v4
    - name: Decide whether to build
      id: check
      env:
        EVENT: ${{ github.event_name }}
        FORCE: ${{ inputs.force }}
        SCHEDULE: ${{ github.event.schedule }}
      run: python3 gate.py >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Tag airport diagrams
      run: ./run.sh

    - name: Publish to apps4av.org
      uses: appleboy/scp-action@v0.1.7
      with:
        host: apps4av.org
        username: apps4av
        password: ${{ secrets.MAMBA_PASSWORD }}
        port: 22
        strip_components: 1
        source: "out/avare_aptdiags.php"
        target: /home/apps4av/mamba.dreamhosters.com/new
